# relationships app (port 8085): full relationship view across meetings and
# email, built on the people-CRM store (runtime/people-crm/crm.db).
# Port 8085, not 8083: 8083 is the browser fleet's CDP proxy
# (BROWSER_CDP_PROXY_PORT), which the app lost the race to on every boot.
[program:relationships]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/relationships && uv sync --locked --project system/apps/relationships && python3 system/scripts/forward_port.py --manifest system/apps/relationships/app.toml --url http://localhost:8085 && exec system/apps/relationships/.venv/bin/relationships"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/relationships-stdout.log
stderr_logfile=/var/log/supervisor/relationships-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
