[project]
name = "relationships"
version = "0.1.0"
description = "Your full relationship view across meetings and email, built on the people-CRM store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "people-crm",
]

[project.scripts]
relationships = "relationships.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relationships"]

[tool.uv.sources]
people-crm = { path = "../../libs/people_crm", editable = true }

[dependency-groups]
dev = ["imbue-common[testing]"]

[tool.pytest.ini_options]
testpaths = ["."]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
