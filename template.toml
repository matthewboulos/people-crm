# Machine-readable manifest for this template. The sibling
# template.md holds the prose, the Requirements list, and the two
# append-only history logs; this file is authoritative for everything
# below. Both are generated together -- validate_template.py fails if
# they disagree.
format = "v2"

[template]
slug = "people-crm"
title = "People CRM"
description = "A personal relationship view across your meetings and email, kept fresh by a daily sync of Google Calendar, Gmail and Contacts."
thumbnail = "template.svg"
version = "v1"

# How this template is DERIVED from the workspace it came from. An
# update re-runs this recipe rather than diffing two repos, which is what
# keeps an exclusion excluded even though the thing still exists upstream.
[recipe]
include = ["system/apps/relationships/", "system/supervisord.conf.d/relationships.conf", "system/libs/people_crm/", "system/routines/people-crm-sync.toml"]
data_include = []
# FILL IN: one entry per deliberate exclusion (paths left out, and
# features stripped from an included path). Leave [] if nothing was.
exclude = [
  "the people-CRM store (runtime/people-crm/crm.db) and everything else under runtime/ and data/ -- no contacts, interactions or filter rules ship",
  "the legacy meeting-contacts JSON directory the migrate command can import from",
]
# FILL IN: one entry per published-version modification, stated as a RULE
# and NEVER the removed value -- the point of a modification is that the
# value does not ship. e.g. "replace the hardcoded team channel with a
# neutral default". Leave [] if there were none.
modification_rules = [
  "default the sync's calendar to Google's primary calendar instead of the publisher's own address",
  "recognize the user from the connected Google account's address instead of a hardcoded list of the publisher's addresses",
  "replace the publisher's and any real third party's names, addresses and employer domains in tests with fictional example.com / example.org / example.net values",
  "replace example hints in the page's search and filter boxes that came from the publisher's own contacts with neutral examples",
  "drop the supervisord comment referring to the workspace migration archive",
  "create the store empty when the page is opened before the first sync, instead of failing",
]

# Everything an adopter must deal with before this is really theirs.
# One list -- but each entry's KIND says how it is handled, because the
# two are handled at different times by different mechanisms:
#
#   permission / secret / llm = ACTIVATION. The adopting agent acts on
#   these FIRST and BY ITSELF, initiating each latchkey permission
#   request and each secret request before asking the user anything.
#   Every one of them must have a matching requires_ line in template.md
#   and vice versa -- the validator checks that, because an adopter once
#   never got prompted for a permission the app needed.
#
#   The [[requirements.secret]] entries below were AGGREGATED from the
#   included apps' app.toml [[secrets]] and skills' SKILL.md secrets:
#   declarations, plus every data/.secrets/<file>.env the included
#   mcp-servers.json and supervisord programs run under. Fix a wrong one
#   at its declaration, not here.
#
#   adaptation = worked through INTERACTIVELY with the user afterwards.
#   Prose on both sides, so it is not cross-checked.
#
# FILL IN, e.g.:
#   [[requirements.permission]]
#   scope = "slack-api"
#   permission = "slack-read-all"
#
#   [requirements.llm]
#   method = "keyed"   # keyed (an API key, e.g. ANTHROPIC_API_KEY) | keyless (a subscription CLI, e.g. claude -p)
#
#   [[requirements.adaptation]]
#   summary = "the digest channel is hardcoded"
#   resolution = "ask the user which channel to watch"
[requirements]

[[requirements.permission]]
scope = "google-calendar-api"
permission = "google-calendar-read-events"
note = "the sync reads events from the connected account's primary calendar"

[[requirements.permission]]
scope = "google-gmail-api"
permission = "google-gmail-read-messages"
note = "the sync lists recent messages and reads their header metadata only"

[[requirements.permission]]
scope = "google-gmail-api"
permission = "google-gmail-read-profile"
note = "the sync reads the connected account's own address to recognize the user"

[[requirements.permission]]
scope = "google-people-api"
permission = "google-people-read-contacts"
note = "the sync reads contacts to join one person's several addresses"

[requirements.llm]
method = "keyed"
note = "only the optional category-feedback judge (people_crm.ai_judge, litellm via ANTHROPIC_API_KEY) calls Claude, and nothing calls it today; no key is needed to run the app or the sync"

[[requirements.adaptation]]
summary = "the store starts empty -- no data ships"
resolution = "after the Google permissions are approved, run `uv run --no-sync --project system/libs/people_crm people-crm sync` once by hand (about two hours) instead of waiting for the 05:00 routine"

[[requirements.adaptation]]
summary = "only the connected Google account's address is recognized as the user"
resolution = "ask the user for any other addresses they use and add them to DEFAULT_SELF_EMAILS in system/libs/people_crm/src/people_crm/metrics.py, so they are not listed as contacts"

# What the included code needs INSTALLED. apt takes bare names: versions
# are a function of the apt snapshot timestamp, so replaying names at the
# adopter's timestamp yields versions consistent with the rest of their
# environment. The other sources are not snapshot-pinned, so for them the
# recorded version IS the pin (name = version).
#
# FILL IN from what the included code actually needs, e.g.:
#   apt = ["poppler-utils"]
#   [environment.npm_global]
#   "@slack/cli" = "2.1.0"
#   [environment.uv_tools]
#   yt-dlp = "2026.7.1"
#   [environment.cargo_crates]
#   fd-find = "9.0.0"
#
# For an install with no package database (a URL-fetched binary, a browser),
# ship a system/scripts/env.d/<NNNN>-<slug>-<name>.sh unit with NNNN >= 2000,
# include it in the recipe above, and list it in env_d_units.
[environment]
apt = []
env_d_units = []
